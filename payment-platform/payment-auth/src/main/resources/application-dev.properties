# Local development. Still points at a real Oracle and a real Redis.
#
# Redis defaults to the instance already running on the developer's machine, so
# `mvn spring-boot:run -Dspring-boot.run.profiles=dev` needs no environment variables for
# it. The base application.properties leaves REDIS_HOST with no default on purpose - a
# production service must be told where its Redis is, never guess localhost.
#
# Running in a container instead? localhost is the CONTAINER's loopback, so these defaults
# cannot reach the host's Redis whatever the port. Compose passes
# REDIS_HOST=host.docker.internal; see docker/env/dev.env.example.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6363}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false

management.server.address=0.0.0.0

# Plaintext bodies for Postman and curl. AuthStartupGuard refuses to start with this
# false under any profile other than dev or test.
app.security.require-encrypted-payloads=false
app.security.cors.allowed-origins=https://localhost:4200
