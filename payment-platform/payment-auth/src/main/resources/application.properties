# =============================================================================
# auth-service — handshake, ECDH, OTP, browser and partner tokens
#
# The only service that writes session state.
#
# Every ${VAR} without a fallback is a hard startup requirement. Secrets are never
# defaulted: the service refuses to run rather than run with a key from source control.
# =============================================================================
spring.application.name=auth-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Virtual threads are supported on JDK 25 but switched off by decision, matching the
# existing production deployment model. Note that the pool is currently acting as an
# implicit cap on concurrent upstream calls; see the bulkheads below.
spring.threads.virtual.enabled=false

server.port=${SERVER_PORT:8443}
server.forward-headers-strategy=native
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.lifecycle.timeout-per-shutdown-phase=25s
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=25
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=5s

# --- Oracle: audit ledger and upstream interaction log only ------------------
# DDL is applied by the DBA from src/main/resources/db. The service validates the
# mapping against the live schema and never alters it.
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${ORACLE_SCHEMA}

# --- Redis: sole store for session, nonce and OTP state ----------------------
# No fallback. If Redis is down the service returns 503 rather than degrading to
# per-node state, which would silently disable replay protection and attempt counting
# across the cluster.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS:true}
spring.data.redis.timeout=1500ms
spring.data.redis.connect-timeout=1500ms
spring.data.redis.lettuce.pool.max-active=64

# --- Actuator: separate port, internal interface, authenticated scrape -------
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.prometheus.access=read-only
management.metrics.tags.application=${spring.application.name}

# --- Shared platform settings ------------------------------------------------
app.security.token-hmac-secret=${PAYMENT_TOKEN_HMAC_SECRET}
app.security.session-ttl-seconds=300
app.security.token-ttl-seconds=300
app.security.nonce-window-seconds=60
app.security.clock-skew-tolerance-seconds=5
app.security.require-encrypted-payloads=true
app.security.cors.allowed-origins=${ALLOWED_ORIGINS}
app.security.actuator-username=${ACTUATOR_USER:prometheus}
app.security.actuator-password=${ACTUATOR_PASSWORD}
# Proxies in front of this service that append to X-Forwarded-For — typically the API
# gateway plus the load balancer. If this is wrong the audit trail records a fabricated
# client address, which is worse than recording none. See ClientContext.
app.security.trusted-proxy-count=${TRUSTED_PROXY_COUNT:2}

app.global.fiid=${GOLDLOAN_FIID:1}
app.global.lms-token-url=${GOLDLOAN_TOKEN_URL}
app.global.lms-fetch-url=${GOLDLOAN_FETCH_URL}
app.global.lms-token-json-field=${GOLDLOAN_TOKEN_FIELD:token}
app.global.lms-token-ttl-seconds=${GOLDLOAN_TOKEN_TTL:1500}
app.global.lms-timeout-seconds=30
app.global.lms-max-concurrent=${LMS_MAX_CONCURRENT:100}

app.async.core-pool-size=8
app.async.max-pool-size=32
app.async.queue-capacity=500

# --- auth-service specific ---------------------------------------------------
auth.otp-pepper=${PAYMENT_OTP_PEPPER}

# THE ATTEMPT CAP IS LOAD-BEARING. Three guesses against 100,000 values is what makes a
# 5-digit code acceptable. Raising max-attempts, removing the lockout, or changing the
# counter reset in OtpService.issue are security changes, not tuning.
auth.otp.length=5
auth.otp.ttl-seconds=180
auth.otp.max-attempts=3
auth.otp.resend-cooldown-seconds=60
auth.otp.max-sends-per-agreement-per-hour=5
auth.otp.lockout-seconds=900

auth.sms.token-url=${SMS_TOKEN_URL}
auth.sms.send-url=${SMS_SEND_URL}
auth.sms.token-json-field=${SMS_TOKEN_FIELD:access_token}
auth.sms.token-ttl-seconds=${SMS_TOKEN_TTL:1500}
auth.sms.timeout-seconds=15
auth.sms.max-concurrent=${SMS_MAX_CONCURRENT:30}
auth.sms.lang=EN
auth.sms.purpose=1001
auth.sms.template=${SMS_TEMPLATE:TPaymentGatewayLoginIT2095}
auth.sms.emp-id=${SMS_EMP_ID:APaymentGatewayLoginIT943}
# DLT-registered wording. {otp} is the only substitution. Changing this text without
# re-registering the template will cause the operator to drop the message.
auth.sms.message-template=Dear Customer, {otp} is your OTP verification code for Payment Gateway. TVS Credit

auth.partner.token-ttl-seconds=900
# partnerCode -> bcrypt hash of the API secret, cost 12+. Hashes, never secrets.
# auth.partner.credentials.ACME=$2a$12$...

# --- Resilience --------------------------------------------------------------
# Bulkhead before circuit breaker. The breaker reacts to sustained failure once it has
# enough samples; the bulkhead bounds the first thirty seconds of a degradation, which
# with a 30s LMS timeout is exactly when the damage happens. max-wait-duration is zero so
# a request without a permit fails fast rather than queueing — that is what keeps
# verify-otp alive while the LMS is slow.
resilience4j.bulkhead.instances.lms.max-concurrent-calls=${LMS_MAX_CONCURRENT:100}
resilience4j.bulkhead.instances.lms.max-wait-duration=0
resilience4j.bulkhead.instances.sms.max-concurrent-calls=${SMS_MAX_CONCURRENT:30}
resilience4j.bulkhead.instances.sms.max-wait-duration=0

resilience4j.circuitbreaker.instances.lms.sliding-window-size=20
resilience4j.circuitbreaker.instances.lms.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.lms.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.lms.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.lms.slow-call-duration-threshold=20s
resilience4j.circuitbreaker.instances.lms.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.sms.sliding-window-size=20
resilience4j.circuitbreaker.instances.sms.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.sms.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sms.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.sms.wait-duration-in-open-state=15s

logging.level.root=INFO
logging.level.com.yourcompany.payment=INFO
