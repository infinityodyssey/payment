# Redis for the payment platform. Same file for dev, UAT and production.
#
# Read the two settings under MEMORY before you deploy this anywhere. The Docker default
# for both is wrong for this application in a way that does not announce itself.

################################## NETWORK ####################################

# 0.0.0.0 inside the container, which is not the same statement as 0.0.0.0 on a host.
# The container has its own network namespace, so this exposes Redis to the Docker
# network only. What makes it reachable from outside is the published port in
# docker-compose.yml - and there it is bound to the private IP, never 0.0.0.0.
bind 0.0.0.0

# Safe only because requirepass is set on the command line. protected-mode is Redis's
# guard against exactly the mistake of binding wide with no password; turning it off
# without setting a password leaves an open Redis holding live session keys.
protected-mode no

port 6379
tcp-backlog 511
tcp-keepalive 300

# Zero: never close an idle client connection. Lettuce holds a long-lived pooled
# connection and a server-side timeout makes it reconnect mid-request, which surfaces as
# an intermittent StateStoreUnavailableException that looks like a Redis outage.
timeout 0

################################## SECURITY ###################################

# requirepass is NOT set here. It is passed on the command line in docker-compose.yml
# from REDIS_PASSWORD so the secret is not in a file that gets committed. A Redis with no
# password on a reachable port is found by scanners in minutes, and what it holds here is
# live AES session keys.

# Commands removed. FLUSHALL on this instance logs out every borrower on all six servers
# and empties the posting rate-limit bucket; KEYS on a production keyspace blocks the
# single-threaded server long enough to time out every caller. Neither is ever needed by
# the application - it uses SETNX, EVAL, HGET and DEL on known keys.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""

# CONFIG is deliberately left alone. Renaming it is a common hardening step and it breaks
# redis_exporter, which reads maxmemory through CONFIG GET - you would lose the one metric
# that tells you how close noeviction is to refusing writes. The controls that matter here
# are requirepass and the network, not the command name.

################################### MEMORY ####################################

# THE TWO SETTINGS THAT MATTER.
#
# maxmemory: Docker's redis image sets none, so Redis grows until the host runs out and
# the kernel OOM-killer picks a victim - frequently a payment service rather than Redis.
# Set it below the container limit (compose sets 1.5g, this is 1g) so Redis refuses
# writes before the cgroup kills the process.
maxmemory 1gb

# maxmemory-policy: this must be noeviction, and it is a security setting, not a tuning
# knob. Every default eviction policy (allkeys-lru, volatile-lru, allkeys-random) deletes
# keys silently to make room, and the keys in here are:
#
#   nonce:*          deleting one re-opens the replay window the AntiReplayFilter closes
#   session:key:*    deleting one kills a live session mid-payment, unexplained
#   session:state:*  deleting one loses an OTP-verified state and the borrower restarts
#   rl:lms-posting   deleting it lets the worker burst past the agreed LMS rate limit
#
# With noeviction, a full Redis fails writes instead. Callers get
# StateStoreUnavailableException, borrowers see a controlled error, and the alert fires.
# That is a bad afternoon. Silent eviction is an incident you find out about from the LMS
# team or an auditor.
maxmemory-policy noeviction

################################ PERSISTENCE ##################################

# Sessions live five minutes, so persistence is not about long-term durability - it is
# about surviving a container restart. Without it, `docker compose up -d` to deploy a new
# Redis image logs out every borrower mid-journey, drops every cached LMS and SMS bearer
# token (so all six servers hit the LMS token endpoint at once) and resets the posting
# rate-limit bucket.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# everysec, not always: at most one second of session state is at risk, and `always`
# fsyncs on every SETNX, which puts a disk write in the path of the anti-replay check on
# every single request.
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as well, as a cheap second copy. stop-writes-on-bgsave-error no is
# deliberate: a failed background save must not stop the platform accepting payments.
save 900 1
save 300 10
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

#################################### TLS ######################################

# Dev runs plaintext on the Docker network and that is fine - nothing leaves the host.
#
# UAT AND PRODUCTION ARE NOT FINE PLAINTEXT. What crosses this connection is AES-256
# session keys, OTP hashes and upstream bearer tokens. On a flat VCN subnet, anything
# that can reach port 6379 can read a live session key and decrypt that borrower's
# traffic. The services already default to REDIS_TLS=true for this reason.
#
# To enable: mount certificates, uncomment below, and set `port 0` so plaintext is off
# rather than merely unused.
#
# port 0
# tls-port 6379
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-ca-cert-file /tls/ca.crt
# tls-auth-clients yes
# tls-protocols "TLSv1.2 TLSv1.3"

################################## LOGGING ####################################

# Empty string means stdout, which the Docker logging driver captures and Promtail ships
# to Loki with everything else.
logfile ""
loglevel notice

# Slow queries. The Lua compare-and-swap in SessionWriteService should be microseconds;
# anything over 10ms here means the server is overloaded or someone added a command that
# scans.
slowlog-log-slower-than 10000
slowlog-max-len 256

################################### CLIENTS ###################################

# Six servers x five services x a Lettuce pool of up to 64 is well inside this, with
# headroom for redis-cli and the exporter.
maxclients 10000

# Keyspace notifications are not used and cost CPU on every expiry. Session expiry is
# handled by TTL plus the sweeper, not by listening for events.
notify-keyspace-events ""
