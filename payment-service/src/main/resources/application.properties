spring.application.name=payment-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.threads.virtual.enabled=false

server.port=${SERVER_PORT:8445}
server.forward-headers-strategy=native
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=25s

spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${ORACLE_SCHEMA}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS:true}
spring.data.redis.timeout=1500ms

management.server.port=${MANAGEMENT_PORT:8083}
management.server.address=${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.prometheus.access=read-only

# Identical across every service: the same secret verifies the same tokens.
app.security.token-hmac-secret=${PAYMENT_TOKEN_HMAC_SECRET}
# Signs PARTNER JWTs. Must differ from the borrower secret — every service holds that
# one, and a leak of it must not let the holder mint a partner token with any role.
app.security.partner-token-secret=${PARTNER_TOKEN_SECRET}
# JWT `iss`. Identical in every service or tokens fail across the split.
app.security.jwt-issuer=${JWT_ISSUER:tvscredit-payment}
# The partner revocation window: disabling a partner takes effect at most this many
# seconds later, because verification is stateless and reads nothing.
app.security.partner-token-ttl-seconds=${PARTNER_TOKEN_TTL:900}
app.security.session-ttl-seconds=300
app.security.token-ttl-seconds=300
app.security.require-encrypted-payloads=true
app.security.cors.allowed-origins=${ALLOWED_ORIGINS}
app.security.actuator-username=${ACTUATOR_USER:prometheus}
app.security.actuator-password=${ACTUATOR_PASSWORD}
app.security.trusted-proxy-count=${TRUSTED_PROXY_COUNT:2}

app.global.fiid=${GOLDLOAN_FIID:1}
app.global.lms-token-url=${GOLDLOAN_TOKEN_URL}
app.global.lms-fetch-url=${GOLDLOAN_FETCH_URL}
app.global.lms-ots-url=${GOLDLOAN_OTS_URL:}
app.global.lms-status-url=${GOLDLOAN_STATUS_URL:}
app.global.lms-post-url=${GOLDLOAN_POST_URL:}
app.global.lms-timeout-seconds=30
app.global.lms-max-concurrent=${LMS_MAX_CONCURRENT:100}

resilience4j.bulkhead.instances.lms.max-concurrent-calls=${LMS_MAX_CONCURRENT:100}
resilience4j.bulkhead.instances.lms.max-wait-duration=0

resilience4j.circuitbreaker.instances.lms.sliding-window-size=20
resilience4j.circuitbreaker.instances.lms.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.lms.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.lms.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.lms.slow-call-duration-threshold=20s
resilience4j.circuitbreaker.instances.lms.wait-duration-in-open-state=15s

logging.level.root=INFO
logging.level.com.yourcompany.payment=INFO
