# Redis for local development. UAT and production use the Redis the infra team runs;
# this file is not deployed there.
#
# ---------------------------------------------------------------------------------------
# WHAT THE REAL REDIS MUST BE TOLD — hand this to whoever installs it
# ---------------------------------------------------------------------------------------
# This Redis is a datastore, not a cache. It holds the only copy of live sessions, AES
# session keys, anti-replay nonces, cached upstream bearer tokens and the posting
# rate-limit bucket. Nothing re-creates them.
#
#   maxmemory-policy noeviction     Stock Redis already defaults to this — the danger is
#                                   someone "tuning it like a cache" and setting an LRU
#                                   policy (which is also the default on several managed
#                                   Redis services). Under an LRU policy Redis silently
#                                   deletes keys to make room, and here that means an
#                                   evicted nonce re-opens the replay window and an
#                                   evicted session key kills a payment mid-journey with
#                                   nothing in any log.
#
#   maxmemory <below the host RAM>  Stock Redis defaults to 0, meaning unlimited, so it
#                                   grows until the host OOM-killer picks a victim. With a
#                                   limit AND noeviction it refuses writes instead:
#                                   callers get StateStoreUnavailableException, borrowers
#                                   see a controlled error, the alert fires.
#
#   appendonly yes                  So a restart does not end every active session and
#                                   empty the token cache for all six servers at once.
#
#   requirepass + TLS               What crosses the wire is AES session keys and OTP
#                                   hashes. On a flat subnet, anything that reaches 6379
#                                   can decrypt a borrower's traffic.
# ---------------------------------------------------------------------------------------

bind 0.0.0.0
protected-mode no
port 6379

# No password locally; the port is published to 127.0.0.1 only. UAT and production must
# have one.
# requirepass ...

maxmemory 256mb
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
dir /data

# Lettuce holds long-lived pooled connections; a server-side idle timeout makes it
# reconnect mid-request, which looks like an intermittent Redis outage.
timeout 0

logfile ""
loglevel notice
